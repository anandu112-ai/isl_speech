# ISL Single-Character Alphabet (A-Z) + Digit (0-9) Recognition Config

dataset:
  raw_dir: "data/raw_alphabet"
  target_dir: "data/isl_alphabet_digits"
  metadata_csv: "data/metadata/alphabet_dataset.csv"
  label_map: "models/alphabet/label_map.json"

model:
  name: "mobilenet_v3_small" # mobilenet_v3_small, mobilenet_v3_large, or efficientnet_b0
  num_classes: 36
  pretrained: true
  dropout: 0.3
  fine_tune_backbone: false
  unfreeze_layers: 2

preprocessing:
  image_size: 224
  horizontal_flip: false # MUST be false for ISL handedness/orientation
  rotation_degrees: 10
  translate: 0.05
  brightness_contrast: 0.1
  hand_crop: false # optional MediaPipe hand bounding box crop

training:
  batch_size: 32
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 7
  seed: 42
  num_workers: 0
  use_class_weights: false

inference:
  confidence_threshold: 0.70
  device: "auto" # auto, cuda, cpu
