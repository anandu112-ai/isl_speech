# Configuration for INCLUDE-50 Indian Sign Language Recognition & Speech Pipeline

dataset:
  selected_csv: "data/metadata/selected_videos.csv"
  video_dir: "data/videos"
  processed_dir: "data/processed"
  features_dir: "data/features"
  manifest_csv: "data/metadata/download_manifest.csv"
  features_manifest: "data/metadata/features_manifest.csv"
  label_map: "data/metadata/label_map.json"
  quality_csv: "data/metadata/video_quality.csv"
  num_classes: 50

preprocessing:
  num_frames: 32
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  dropout: 0.3
  hidden_size: 128
  num_layers: 2
  early_stopping_patience: 10
  num_workers: 0
  seed: 42

model:
  name: "BiLSTM"
  checkpoint_dir: "models/checkpoints"
  best_model_dir: "models/best_model"

inference:
  confidence_threshold: 0.70
  smoothing_window: 5

reports:
  dir: "reports"
